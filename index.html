<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Congratulations on Passing BCBR!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
            background: #0d1b2a; /* Solid base, gradient handled by canvas/overlay */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: #fff;
            perspective: 1200px; /* Deepened perspective */
        }
        
        /* Ambient background glow */
        .ambient-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(30, 20, 60, 0.4) 0%, #0d1b2a 100%);
            z-index: 0;
            animation: pulseBg 8s infinite alternate;
        }

        #card-wrapper {
            display: none;
            z-index: 10;
            width: 100%;
            max-width: 90%;
            width: 700px;
            animation: cardEntrance 3s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            perspective: 1200px;
        }

        @keyframes pulseBg {
            0% { opacity: 0.7; }
            100% { opacity: 1; }
        }

        .card {
            background: rgba(25, 25, 35, 0.4);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            padding: 4rem 3rem;
            text-align: center;
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.6), 
                inset 0 0 0 1px rgba(255,255,255,0.15),
                inset 0 0 20px rgba(255,255,255,0.05);
            width: 100%;
            animation: cardFloat 6s ease-in-out infinite alternate 3s;
            position: relative;
            transform-style: preserve-3d;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
        }
        
        /* Shimmer effect across the card */
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.1), transparent);
            transform: skewX(-20deg);
            animation: shimmer 5s infinite;
            z-index: -1;
        }

        @keyframes shimmer {
            0% { left: -100%; }
            20% { left: 200%; }
            100% { left: 200%; }
        }

        @keyframes cardEntrance {
            0% { opacity: 0; transform: translateY(80px) rotateX(15deg) scale(0.8); }
            50% { opacity: 1; transform: translateY(-10px) rotateX(-5deg) scale(1.02); }
            100% { opacity: 1; transform: translateY(0) rotateX(0deg) scale(1); }
        }
        
        @keyframes cardFloat {
            0% { transform: translateY(0) rotateX(0deg); }
            100% { transform: translateY(-15px) rotateX(2deg) rotateY(1deg); box-shadow: 0 40px 70px rgba(0, 0, 0, 0.7), inset 0 0 0 1px rgba(255,255,255,0.2); }
        }

        .h1-wrapper {
            display: inline-block;
            animation: floatText 4s ease-in-out infinite alternate 2s;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 5.5rem;
            margin-bottom: 1rem;
            position: relative;
            display: inline-block;
            color: transparent;
            -webkit-text-stroke: 1px rgba(255,255,255,0.3);
            text-shadow: 
                0px 1px 0px #c2185b,
                0px 2px 0px #ad1457,
                0px 3px 0px #880e4f,
                0px 4px 0px #880e4f,
                0px 5px 4px rgba(0,0,0,0.5),
                0px 10px 15px rgba(0,0,0,0.3),
                0px 20px 25px rgba(216, 27, 96, 0.5);
            animation: textPop 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.5s both, glow 3s ease-in-out infinite alternate;
            transform-origin: center;
        }

        @keyframes textPop {
            0% { transform: scale(0.5); opacity: 0; filter: blur(10px); }
            100% { transform: scale(1); opacity: 1; filter: blur(0); }
        }

        h1::before {
            content: "Congratulations!";
            position: absolute;
            left: 0;
            top: 0;
            color: #f48fb1;
            -webkit-text-stroke: 0;
            mask-image: linear-gradient(to bottom, transparent 10%, black 90%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 10%, black 90%);
            animation: shine 3s linear infinite;
        }

        @keyframes floatText {
            0% { transform: translateY(0px) rotateZ(-2deg) scale(1); }
            100% { transform: translateY(-10px) rotateZ(2deg) scale(1.05); }
        }

        @keyframes glow {
            0% { filter: drop-shadow(0 0 15px rgba(216, 27, 96, 0.6)); }
            100% { filter: drop-shadow(0 0 40px rgba(216, 27, 96, 1)) drop-shadow(0 0 80px rgba(255, 128, 171, 0.8)); }
        }

        @keyframes shine {
            0% { filter: brightness(1); }
            50% { filter: brightness(1.8); text-shadow: 0 0 30px #fff; }
            100% { filter: brightness(1); }
        }

        p {
            font-size: 1.3rem;
            line-height: 1.7;
            margin-bottom: 1.5rem;
            color: #e0e0e0;
            opacity: 0;
            transform: translateY(20px) translateZ(-30px);
            animation: slideUpFade 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }
        
        p:nth-of-type(1) { animation-delay: 1.8s; }
        p:nth-of-type(2) { animation-delay: 2.8s; }
        p:nth-of-type(3) { animation-delay: 3.8s; }

        @keyframes slideUpFade {
            to { opacity: 1; transform: translateY(0) translateZ(0); }
        }

        .highlight {
            font-weight: 800;
            color: #64b5f6;
            display: inline-block;
            position: relative;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: default;
            padding: 0 5px;
        }

        .highlight::before {
            content: '';
            position: absolute;
            inset: -2px -5px;
            background: rgba(100, 181, 246, 0.1);
            border-radius: 8px;
            transform: scale(0);
            transition: transform 0.4s ease;
            z-index: -1;
        }

        .highlight::after {
            content: '';
            position: absolute;
            width: 100%;
            transform: scaleX(0);
            height: 3px;
            bottom: 0;
            left: 0;
            background: linear-gradient(90deg, #42a5f5, #1e88e5);
            transform-origin: bottom right;
            transition: transform 0.3s ease-out;
            box-shadow: 0 0 15px #42a5f5;
        }

        .highlight:hover {
            transform: scale(1.15) translateY(-3px);
            color: #bbdefb;
            text-shadow: 0 0 20px rgba(100, 181, 246, 0.9);
            letter-spacing: 1px;
        }

        .highlight:hover::before { transform: scale(1); }
        .highlight:hover::after {
            transform: scaleX(1);
            transform-origin: bottom left;
        }

        .heart {
            color: #ff4081;
            display: inline-block;
            animation: heartbeat 1s infinite cubic-bezier(0.215, 0.61, 0.355, 1);
            filter: drop-shadow(0 0 8px rgba(255, 64, 129, 0.8));
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            15% { transform: scale(1.4); filter: drop-shadow(0 0 15px rgba(255, 64, 129, 1)); }
            30% { transform: scale(1); }
            45% { transform: scale(1.4); filter: drop-shadow(0 0 15px rgba(255, 64, 129, 1)); }
            70% { transform: scale(1); }
        }

        #flowers-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 300px;
            pointer-events: none;
            z-index: 15;
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            padding: 0 2%;
            box-sizing: border-box;
            perspective: 800px;
        }

        .flower-wrapper {
            position: relative;
            bottom: -100px;
            opacity: 0;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
        }

        .flower {
            width: 120px;
            height: 120px;
            transform-origin: bottom center;
        }

        /* Wrapper moves up */
        .fw-1 { animation: riseUp 2.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.5s forwards; }
        .fw-2 { animation: riseUp 2.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) 1.2s forwards; }
        .fw-3 { animation: riseUp 2.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.8s forwards; }
        .fw-4 { animation: riseUp 2.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) 1.5s forwards; }
        .fw-5 { animation: riseUp 2.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) 1.0s forwards; }
        .fw-6 { animation: riseUp 2.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) 1.8s forwards; }

        /* Container sways continuously */
        .fw-1 .flower { animation: windSway1 6s ease-in-out 3.5s infinite alternate; }
        .fw-2 .flower { animation: windSway2 7s ease-in-out 4.4s infinite alternate-reverse; }
        .fw-3 .flower { animation: windSway1 5s ease-in-out 3.6s infinite alternate; }
        .fw-4 .flower { animation: windSway3 6.5s ease-in-out 4.9s infinite alternate-reverse; }
        .fw-5 .flower { animation: windSway2 5.5s ease-in-out 4.1s infinite alternate; }
        .fw-6 .flower { animation: windSway3 7.5s ease-in-out 5.1s infinite alternate; }

        .flower svg {
            width: 100%;
            height: 100%;
            transform: scale(0) rotateX(90deg) rotateZ(45deg);
            transform-origin: center bottom;
        }

        /* SVG blooms once */
        .fw-1 svg { animation: bloomComplex 2s cubic-bezier(0.34, 1.56, 0.64, 1) 1.5s forwards; }
        .fw-2 svg { animation: bloomComplex 2.2s cubic-bezier(0.34, 1.56, 0.64, 1) 2.2s forwards; }
        .fw-3 svg { animation: bloomComplex 1.8s cubic-bezier(0.34, 1.56, 0.64, 1) 1.8s forwards; }
        .fw-4 svg { animation: bloomComplex 2.4s cubic-bezier(0.34, 1.56, 0.64, 1) 2.5s forwards; }
        .fw-5 svg { animation: bloomComplex 2.1s cubic-bezier(0.34, 1.56, 0.64, 1) 2.0s forwards; }
        .fw-6 svg { animation: bloomComplex 2.3s cubic-bezier(0.34, 1.56, 0.64, 1) 2.8s forwards; }

        @keyframes riseUp {
            0% { bottom: -100px; opacity: 0; transform: scale(0.5); }
            100% { bottom: 0; opacity: 1; transform: scale(1); }
        }

        @keyframes bloomComplex {
            0% { transform: scale(0) rotateX(90deg) rotateZ(-45deg); filter: brightness(0.5); }
            60% { transform: scale(1.2) rotateX(-15deg) rotateZ(10deg); filter: brightness(1.2); }
            80% { transform: scale(0.95) rotateX(5deg) rotateZ(-5deg); filter: brightness(1.1); }
            100% { transform: scale(1) rotateX(0deg) rotateZ(0deg); filter: brightness(1); }
        }

        /* Varied sway animations for natural feel */
        @keyframes windSway1 { 0% { transform: rotateZ(-6deg) skewX(2deg); } 100% { transform: rotateZ(8deg) skewX(-2deg); } }
        @keyframes windSway2 { 0% { transform: rotateZ(-8deg) skewX(-2deg); } 100% { transform: rotateZ(6deg) skewX(3deg); } }
        @keyframes windSway3 { 0% { transform: rotateZ(-5deg) skewX(1deg); } 100% { transform: rotateZ(9deg) skewX(-1deg); } }

        /* Petal pulse for glowing center */
        .flower-center {
            animation: pulseGlow 2s infinite alternate;
            transform-origin: center;
        }
        @keyframes pulseGlow {
            0% { transform: scale(0.9); filter: drop-shadow(0 0 5px rgba(255,255,255,0.5)); }
            100% { transform: scale(1.1); filter: drop-shadow(0 0 15px rgba(255,255,255,0.9)); }
        }

        #petalsCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none; /* Prevents canvas from blocking clicks */
        }
        
        #start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 27, 42, 0.98);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            cursor: pointer;
            transition: opacity 0.8s ease, backdrop-filter 0.8s;
            backdrop-filter: blur(10px);
        }
        
        .pulse-btn {
            background: linear-gradient(45deg, #d81b60, #8e24aa, #3949ab);
            background-size: 200% 200%;
            border: none;
            padding: 15px 50px;
            font-size: 1.5rem;
            color: white;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(216, 27, 96, 0.6);
            animation: pulseBtn 2s infinite, gradientShift 3s ease infinite;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            margin-top: 30px;
            transition: transform 0.2s;
        }

        .pulse-btn:hover { transform: scale(1.05); }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        @keyframes pulseBtn {
            0% { box-shadow: 0 0 0 0 rgba(216, 27, 96, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(216, 27, 96, 0); }
            100% { box-shadow: 0 0 0 0 rgba(216, 27, 96, 0); }
        }

        /* Floating particles behind card */
        #particles-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
            overflow: hidden;
        }

        .bg-particle {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.3;
            animation: floatUp 15s linear infinite;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 0.5; transform: scale(1); }
            90% { opacity: 0.5; transform: scale(1); }
            100% { transform: translateY(-100px) scale(0); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="ambient-bg"></div>
    <div id="particles-container"></div>

    <div id="start-overlay">
        <h2 style="font-family: 'Dancing Script', cursive; font-size: 4rem; color: #f48fb1; text-align: center; margin-bottom: 15px; text-shadow: 0 0 20px rgba(244, 143, 177, 0.5); animation: floatText 3s ease-in-out infinite alternate;">A Special Message For You</h2>
        <p style="opacity: 1; animation: none; font-size: 1.3rem; color: #b0bec5; letter-spacing: 2px;">Click anywhere to begin the celebration</p>
        <button class="pulse-btn">Open Card</button>
    </div>

    <canvas id="petalsCanvas"></canvas>

    <div id="card-wrapper">
        <div class="card" id="main-card">
            <div class="h1-wrapper">
                <h1>Congratulations!</h1>
            </div>
            <p>To my amazing wife, I am so incredibly proud of you for passing the <span class="highlight">BCBR exam</span>.</p>
            <p>All your hard work, late nights, and unyielding dedication have brilliantly paid off. You are truly inspiring!</p>
            <p style="font-size: 2rem; margin-top: 2.5rem; font-weight: 600; text-shadow: 0 5px 15px rgba(0,0,0,0.6); color: #fff;">I love you! <span class="heart">❤️</span></p>
        </div>
    </div>

    <div id="flowers-container" style="display: none;">
        <!-- Flower 1: Pink Lotus -->
        <div class="flower-wrapper fw-1">
            <div class="flower">
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="grad1" x1="0%" y1="100%" x2="0%" y2="0%">
                            <stop offset="0%" style="stop-color:#ad1457;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#f48fb1;stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <path d="M50 100 Q 40 60 50 50 Q 60 60 50 100 Z" fill="#1b5e20"/>
                    <path d="M50 50 C 20 40 0 15 25 5 C 40 0 45 20 50 50 Z" fill="url(#grad1)" opacity="0.9"/>
                    <path d="M50 50 C 80 40 100 15 75 5 C 60 0 55 20 50 50 Z" fill="url(#grad1)" opacity="0.9"/>
                    <path d="M50 50 C 25 55 -5 30 15 15 C 30 5 40 25 50 50 Z" fill="url(#grad1)"/>
                    <path d="M50 50 C 75 55 105 30 85 15 C 70 5 60 25 50 50 Z" fill="url(#grad1)"/>
                    <path d="M50 50 C 35 25 35 -5 50 0 C 65 -5 65 25 50 50 Z" fill="#ff4081"/>
                    <circle class="flower-center" cx="50" cy="50" r="10" fill="#ffd54f" filter="drop-shadow(0 0 5px #f57f17)"/>
                    <circle cx="50" cy="50" r="4" fill="#fff" opacity="0.8"/>
                </svg>
            </div>
        </div>
        
        <!-- Flower 2: Purple Lily -->
        <div class="flower-wrapper fw-2" style="transform: scale(1.3) translateY(10px);">
            <div class="flower">
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <radialGradient id="grad2" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" style="stop-color:#e040fb;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#4a148c;stop-opacity:1" />
                        </radialGradient>
                    </defs>
                    <path d="M50 100 Q 48 70 50 45 Q 52 70 50 100 Z" fill="#2e7d32"/>
                    <path d="M50 45 Q 15 5 10 30 Q 30 65 50 45 Z" fill="url(#grad2)" />
                    <path d="M50 45 Q 85 5 90 30 Q 70 65 50 45 Z" fill="url(#grad2)" />
                    <path d="M50 45 Q 5 45 20 75 Q 45 65 50 45 Z" fill="url(#grad2)" />
                    <path d="M50 45 Q 95 45 80 75 Q 55 65 50 45 Z" fill="url(#grad2)" />
                    <path d="M50 45 Q 30 -10 50 0 Q 70 -10 50 45 Z" fill="#ba68c8" />
                    <!-- Stamens -->
                    <g transform="translate(50, 45)">
                        <line x1="0" y1="0" x2="-15" y2="-25" stroke="#ffeb3b" stroke-width="2"/>
                        <circle cx="-15" cy="-25" r="4" fill="#ff9800"/>
                        <line x1="0" y1="0" x2="0" y2="-30" stroke="#ffeb3b" stroke-width="2"/>
                        <circle cx="0" cy="-30" r="4" fill="#ff9800"/>
                        <line x1="0" y1="0" x2="15" y2="-25" stroke="#ffeb3b" stroke-width="2"/>
                        <circle cx="15" cy="-25" r="4" fill="#ff9800"/>
                    </g>
                    <circle class="flower-center" cx="50" cy="45" r="8" fill="#fff59d" />
                </svg>
            </div>
        </div>

        <!-- Flower 3: Blue/Cyan Star -->
        <div class="flower-wrapper fw-3" style="transform: scale(0.8);">
            <div class="flower">
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#40c4ff;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#01579b;stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <path d="M50 100 Q 49 70 50 40 Q 51 70 50 100 Z" fill="#388e3c"/>
                    <!-- Multi-layered petals -->
                    <g fill="url(#grad3)">
                        <path d="M50 40 L 50 -5 L 60 25 Z"/> <path d="M50 40 L 50 -5 L 40 25 Z"/>
                        <path d="M50 40 L 95 10 L 70 35 Z"/> <path d="M50 40 L 95 10 L 60 20 Z"/>
                        <path d="M50 40 L 105 50 L 75 60 Z"/> <path d="M50 40 L 105 50 L 75 40 Z"/>
                        <path d="M50 40 L 5 10 L 30 35 Z"/> <path d="M50 40 L 5 10 L 40 20 Z"/>
                        <path d="M50 40 L -5 50 L 25 60 Z"/> <path d="M50 40 L -5 50 L 25 40 Z"/>
                    </g>
                    <circle class="flower-center" cx="50" cy="40" r="12" fill="#ffff00" />
                    <circle cx="50" cy="40" r="8" fill="#ff6d00" />
                </svg>
            </div>
        </div>
        
        <!-- Flower 4: Orange Rose -->
        <div class="flower-wrapper fw-4" style="transform: scale(1.15) translateY(-5px);">
            <div class="flower">
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <radialGradient id="grad4" cx="40%" cy="40%" r="60%">
                            <stop offset="0%" style="stop-color:#ffca28;stop-opacity:1" />
                            <stop offset="50%" style="stop-color:#ff5722;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#bf360c;stop-opacity:1" />
                        </radialGradient>
                    </defs>
                    <path d="M50 100 Q 45 70 50 50 Q 55 70 50 100 Z" fill="#1b5e20"/>
                    <!-- Leaves -->
                    <path d="M50 70 Q 20 60 25 80 Z" fill="#388e3c"/>
                    <path d="M50 65 Q 80 50 75 75 Z" fill="#388e3c"/>
                    
                    <circle cx="50" cy="45" r="38" fill="url(#grad4)" />
                    <path d="M 15 45 C 15 15, 85 15, 85 45 C 85 75, 15 75, 15 45 Z" fill="rgba(0,0,0,0.15)" transform="rotate(25 50 45)"/>
                    <circle cx="50" cy="45" r="28" fill="#e64a19" opacity="0.9"/>
                    <path d="M 25 45 C 25 20, 75 20, 75 45 C 75 70, 25 70, 25 45 Z" fill="rgba(0,0,0,0.2)" transform="rotate(-35 50 45)"/>
                    <circle class="flower-center" cx="50" cy="45" r="18" fill="#fb8c00" opacity="0.95"/>
                    <circle cx="50" cy="45" r="10" fill="#ffa000" />
                    
                    <path d="M 42 45 Q 50 30 58 45 Q 50 60 42 45" fill="none" stroke="#fff" stroke-width="2" opacity="0.6"/>
                    <path d="M 35 45 Q 50 20 65 45 Q 50 70 35 45" fill="none" stroke="#fff" stroke-width="1" opacity="0.4"/>
                </svg>
            </div>
        </div>

        <!-- Flower 5: Small Yellow/Red -->
        <div class="flower-wrapper fw-5" style="transform: scale(0.9) translateY(15px);">
            <div class="flower">
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="grad5" x1="0%" y1="100%" x2="0%" y2="0%">
                            <stop offset="0%" style="stop-color:#ffeb3b;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#d32f2f;stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <path d="M50 100 Q 52 70 50 45 Q 48 70 50 100 Z" fill="#2e7d32"/>
                    <path d="M50 45 Q 20 10 30 5 Q 45 25 50 45 Z" fill="url(#grad5)" />
                    <path d="M50 45 Q 80 10 70 5 Q 55 25 50 45 Z" fill="url(#grad5)" />
                    <path d="M50 45 Q 5 50 0 35 Q 35 40 50 45 Z" fill="url(#grad5)" />
                    <path d="M50 45 Q 95 50 100 35 Q 65 40 50 45 Z" fill="url(#grad5)" />
                    <path d="M50 45 Q 50 -5 50 -10 Q 60 15 50 45 Z" fill="#c62828" />
                    <circle class="flower-center" cx="50" cy="45" r="14" fill="#212121" />
                    <circle cx="50" cy="45" r="10" fill="#424242" stroke="#ffeb3b" stroke-width="2" stroke-dasharray="2,3"/>
                </svg>
            </div>
        </div>
        
        <!-- Flower 6: Extra Pink Lotus (copy 1) -->
        <div class="flower-wrapper fw-6" style="transform: scale(1) translateY(5px) rotateY(180deg);">
            <div class="flower">
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <path d="M50 100 Q 40 60 50 50 Q 60 60 50 100 Z" fill="#1b5e20"/>
                    <path d="M50 50 C 20 40 0 15 25 5 C 40 0 45 20 50 50 Z" fill="url(#grad1)" opacity="0.9"/>
                    <path d="M50 50 C 80 40 100 15 75 5 C 60 0 55 20 50 50 Z" fill="url(#grad1)" opacity="0.9"/>
                    <path d="M50 50 C 25 55 -5 30 15 15 C 30 5 40 25 50 50 Z" fill="url(#grad1)"/>
                    <path d="M50 50 C 75 55 105 30 85 15 C 70 5 60 25 50 50 Z" fill="url(#grad1)"/>
                    <path d="M50 50 C 35 25 35 -5 50 0 C 65 -5 65 25 50 50 Z" fill="#f06292"/>
                    <circle class="flower-center" cx="50" cy="50" r="9" fill="#ffca28" />
                </svg>
            </div>
        </div>
    </div>

    <script>
        // Create background floating particles
        function createBgParticles() {
            const container = document.getElementById('particles-container');
            for(let i=0; i<30; i++) {
                let particle = document.createElement('div');
                particle.className = 'bg-particle';
                let size = Math.random() * 5 + 2;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = Math.random() * 100 + 'vw';
                particle.style.animationDuration = (Math.random() * 20 + 10) + 's';
                particle.style.animationDelay = (Math.random() * 20) + 's';
                container.appendChild(particle);
            }
        }
        createBgParticles();

        const canvas = document.getElementById('petalsCanvas');
        const ctx = canvas.getContext('2d');
        let cw = window.innerWidth;
        let ch = window.innerHeight;
        canvas.width = cw;
        canvas.height = ch;

        let petals = [];
        let isStarted = false;

        const startOverlay = document.getElementById('start-overlay');
        const mainCard = document.getElementById('card-wrapper');
        const flowersContainer = document.getElementById('flowers-container');

        startOverlay.addEventListener('click', () => {
            startOverlay.style.opacity = '0';
            startOverlay.style.backdropFilter = 'blur(0px)';
            
            setTimeout(() => {
                startOverlay.style.display = 'none';
                mainCard.style.display = 'block';
                flowersContainer.style.display = 'flex';
                isStarted = true;
            }, 800);
        });

        window.addEventListener('resize', () => {
            cw = window.innerWidth;
            ch = window.innerHeight;
            canvas.width = cw;
            canvas.height = ch;
        });

        class Petal {
            constructor() {
                this.x = Math.random() * cw;
                this.y = Math.random() * ch - ch; // Start distributed above/across screen initially
                this.w = Math.random() * 15 + 10;
                this.h = Math.random() * 20 + 15;
                this.opacity = Math.random() * 0.5 + 0.5;
                this.flip = Math.random() * Math.PI;
                this.flipSpeed = Math.random() * 0.03 + 0.01;
                this.yVelocity = Math.random() * 1.5 + 1;
                this.xVelocity = Math.random() * 1 - 0.5;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = Math.random() * 0.03 - 0.015;
                
                // Varied pink, rose, and light red hues
                const hues = [330, 340, 350, 0];
                this.hue = hues[Math.floor(Math.random() * hues.length)];
                this.saturation = Math.random() * 20 + 80;
                this.lightness = Math.random() * 20 + 60;
                this.color = `hsla(${this.hue}, ${this.saturation}%, ${this.lightness}%, ${this.opacity})`;
            }

            update() {
                this.y += this.yVelocity;
                this.x += this.xVelocity;
                this.flip += this.flipSpeed;
                this.rotation += this.rotationSpeed;

                // Swaying motion using sine wave
                this.x += Math.sin(this.flip) * 0.5;

                // Reset when falls below screen
                if (this.y > ch + this.h) {
                    this.y = -this.h;
                    this.x = Math.random() * cw;
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                // Simulate 3D flipping by scaling Y axis
                ctx.scale(1, Math.sin(this.flip));
                
                ctx.fillStyle = this.color;
                ctx.beginPath();
                // Draw a beautiful organic petal shape
                ctx.moveTo(0, -this.h/2);
                ctx.bezierCurveTo(this.w/2, -this.h/2, this.w/2, this.h/2, 0, this.h/2);
                ctx.bezierCurveTo(-this.w/2, this.h/2, -this.w/2, -this.h/2, 0, -this.h/2);
                ctx.fill();
                ctx.restore();
            }
        }

        // Initialize petals
        for (let i = 0; i < 100; i++) {
            petals.push(new Petal());
            // Pre-distribute them randomly vertically so they don't all fall at once initially
            petals[i].y = Math.random() * ch;
        }

        function loop() {
            requestAnimationFrame(loop);
            
            // Clear canvas entirely each frame for clean sharp rendering
            ctx.clearRect(0, 0, cw, ch);

            if(!isStarted) return;

            for (let i = 0; i < petals.length; i++) {
                petals[i].update();
                petals[i].draw();
            }
        }
        
        window.onload = () => {
            loop();
        };
    </script>
</body>
</html>
