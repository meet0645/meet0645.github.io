<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For My Love</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Indie+Flower&display=swap" rel="stylesheet">
    
    <style>
        /* --- Core Layout --- */
        body {
            font-family: 'Playfair Display', serif;
            background: linear-gradient(to bottom, #fdf2f8, #fbcfe8);
            overflow: hidden;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
            height: 100dvh; /* Dynamic viewport height for mobile */
            width: 100vw;
        }

        .handwriting { font-family: 'Dancing Script', cursive; }
        .notebook-font { font-family: 'Indie Flower', cursive; }

        /* --- Z-Index Hierarchy (Crucial for interaction) --- */
        #flowerCanvas { z-index: 1; pointer-events: none; } /* Background */
        #envelope-stage { z-index: 50; } /* Top priority initially */
        .stage { z-index: 40; } /* Content stages */

        /* --- Envelope Styles --- */
        .envelope-wrapper {
            cursor: pointer;
            padding: 20px; /* Increase hit area */
        }

        .envelope {
            position: relative;
            width: 300px;
            height: 200px;
            background: #e11d48;
            margin: 0 auto;
            border-radius: 0 0 10px 10px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            transition: transform 1s ease;
        }

        /* The Flap */
        .flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #be123c;
            clip-path: polygon(0 0, 50% 50%, 100% 0);
            transform-origin: top;
            transition: transform 0.6s ease 0.4s, z-index 0.2s;
            z-index: 3;
            border-radius: 5px 5px 0 0;
        }

        /* Open State Animations */
        .envelope.open .flap {
            transform: rotateX(180deg);
            z-index: 0;
        }
        
        .envelope.open {
            transform: translateY(100px);
        }

        /* The Pocket (Front Triangle) */
        .pocket-front {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 100px 150px 0 150px;
            border-color: transparent #fb7185 #f43f5e #fb7185;
            z-index: 4; /* High z-index to look right, but ensure click passes if needed */
            pointer-events: none; /* Let clicks pass through to envelope */
            border-radius: 0 0 10px 10px;
        }

        /* The Letter Inside (Preview) */
        .letter-preview {
            position: absolute;
            top: 10px;
            left: 20px;
            right: 20px;
            height: 160px;
            background: white;
            z-index: 1;
            transition: transform 0.8s ease 1s;
            border-radius: 5px;
        }
        
        .envelope.open .letter-preview {
            transform: translateY(-120px);
            z-index: 2;
        }

        /* --- Overlay Stages (Letters & Notebook) --- */
        .stage {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease, transform 0.5s ease;
            background: rgba(255, 255, 255, 0.4); /* Slight backdrop */
        }

        .stage.active { opacity: 1; pointer-events: auto; }
        .stage.hidden-left { transform: translateX(-110%); opacity: 0; }
        
        /* Glassmorphism Card */
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        /* --- Notebook Styles --- */
        .notebook {
            width: 90%; max-width: 380px; height: 550px;
            background: #fff;
            background-image: linear-gradient(#e5e5e5 1px, transparent 1px);
            background-size: 100% 2rem;
            position: relative;
            box-shadow: 10px 10px 30px rgba(0,0,0,0.15);
            border-radius: 4px;
            transition: transform 0.3s ease;
        }
        .notebook::before {
            content: ''; position: absolute; left: 10px; top: 0; bottom: 0; width: 25px;
            background: radial-gradient(circle at center, #333 30%, transparent 32%) 0 0;
            background-size: 100% 2rem; border-right: 2px solid rgba(0,0,0,0.1);
            z-index: 10;
        }
        .red-margin {
            position: absolute; left: 45px; top: 0; bottom: 0; border-left: 2px solid #fca5a5;
        }
        .notebook-page {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            padding: 3rem 1.5rem 2rem 3.5rem;
            box-sizing: border-box;
            display: none; flex-direction: column;
            transform-origin: left center;
            animation: fadeInPage 0.5s ease;
        }
        .notebook-page.active-page { display: flex; }
        
        @keyframes fadeInPage {
            from { opacity: 0; transform: rotateY(-5deg); }
            to { opacity: 1; transform: rotateY(0); }
        }

        /* --- Decorations --- */
        .heart-seal { animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1) translate(-50%, -50%); } 50% { transform: scale(1.1) translate(-50%, -50%); } }
        
        #flowerCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; }
        
        .sticker { position: absolute; pointer-events: none; opacity: 0.9; filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.1)); }
    </style>
</head>
<body class="relative overflow-hidden">

    <!-- Background Canvas -->
    <canvas id="flowerCanvas"></canvas>

    <!-- 1. Envelope Stage (Top Layer Initially) -->
    <div id="envelope-stage" class="absolute inset-0 flex flex-col items-center justify-center">
        <!-- Added a wrapper with a click handler -->
        <div id="envelope-click-target" class="envelope-wrapper">
            <div class="envelope" id="mainEnvelope">
                <div class="flap"></div>
                <div class="pocket-front"></div>
                
                <!-- Preview Letter Inside -->
                <div class="letter-preview flex flex-col items-center justify-center p-4 shadow-sm">
                    <p class="handwriting text-2xl text-gray-800">For You Rin ❤️</p>
                    <div class="w-full h-1 bg-gray-200 mt-2 mb-2 rounded"></div>
                    <div class="w-2/3 h-1 bg-gray-200 rounded"></div>
                </div>

                <!-- Seal -->
                <div class="absolute top-1/2 left-1/2 z-10 heart-seal bg-white rounded-full p-2 shadow-md">
                    <svg class="h-8 w-8 text-red-500 fill-current" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                </div>
            </div>
            
            <div class="mt-12 text-center">
                <p class="text-pink-700 font-bold animate-pulse text-xl tracking-widest bg-white/50 px-4 py-1 rounded-full inline-block">TAP TO OPEN</p>
            </div>
        </div>
    </div>

    <!-- 2. Letter Stage -->
    <div id="letter-stage" class="stage">
        <div class="glass-card w-full max-w-md p-8 rounded-2xl m-4 relative flex flex-col min-h-[50vh]">
            <!-- Decorative Corners -->
            <div class="absolute top-2 right-2 text-2xl opacity-30">🌸</div>
            <div class="absolute bottom-2 left-2 text-2xl opacity-30">🌸</div>

            <div id="letter-content" class="flex-grow flex flex-col justify-center items-center text-center transition-opacity duration-300">
                <!-- Content injected via JS -->
            </div>
            
            <div class="flex justify-between items-center mt-8 pt-4 border-t border-pink-100">
                <button id="btn-prev-letter" class="text-pink-400 p-3 hover:bg-pink-50 rounded-full transition">
                    <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" /></svg>
                </button>
                
                <div class="flex space-x-2" id="dots-container"></div>
                
                <button id="btn-next-letter" class="bg-pink-500 text-white px-6 py-2 rounded-full shadow-lg active:scale-95 transition font-semibold flex items-center gap-2">
                    Next <span class="text-xs">❤️</span>
                </button>
            </div>
        </div>
        
        <button id="btn-open-notebook" class="mt-6 bg-yellow-100 border-2 border-yellow-300 text-yellow-800 px-6 py-3 rounded-xl font-bold shadow-md active:scale-95 transition flex items-center gap-2 notebook-font text-xl">
            📖 Open Notebook
        </button>
    </div>

    <!-- 3. Notebook Stage -->
    <div id="notebook-stage" class="stage bg-gray-900/20 backdrop-blur-sm">
        <div class="notebook relative" id="notebook-content-area">
            <div class="red-margin"></div>
            
            <!-- Pages injected via JS -->
            <div id="notebook-pages" class="h-full relative z-20"></div>

            <!-- Decorations -->
            <div class="sticker -top-4 -right-2 text-5xl">📌</div>
            <div class="sticker bottom-20 -right-6 text-5xl rotate-12">❤️</div>
        </div>

        <div class="mt-8 flex flex-col items-center gap-2">
            <p class="text-white text-sm opacity-80 font-medium">Tap left/right side of page to flip</p>
            <button id="btn-close-notebook" class="text-white underline text-sm bg-black/20 px-4 py-1 rounded-full">Close Notebook</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            /* --- Data --- */
            const letters = [
                { title: "My Dearest Rin,", body: "I wanted to make something special just for you. A little digital corner of the world where flowers bloom just for us." },
                { title: "To My Favorite Person", body: "Every moment with you is a treasure I keep safe in my heart. You make the ordinary feel extraordinary." },
                { title: "Always,", body: "I love you more than words can say.<br><br>Forever & Always." },
                { title: "My Safe Place", body: "Whenever the world feels too loud, I just need to think of your smile, and suddenly, everything is quiet and peaceful again." },
                { title: "Future Us", body: "I can't wait for all the tomorrows we have yet to meet. Coffee dates, lazy Sundays, and growing old together." },
                { title: "Always,", body: "I love you more than words can say.<br><br>Forever & Always." }
            ];

            const notebookEntries = [
                { date: "Chapter 1", text: "This is our story.<br><br>A collection of moments, big and small, that make us who we are." },
                { date: "Reason #1", text: "Your Laugh.<br><br>It is the best sound in the world. It makes my bad days disappear instantly." },
                { date: "Reason #2", text: "Your Support.<br><br>Thank you for always believing in me, even when I doubt myself." },
                { date: "Dreaming", text: "One day, we will go on that trip we always talk about. Just you, me, and the sunset." },
                { date: "The End?", text: "Never.<br><br>This is just the beginning.<br>I love you!" }
            ];

            /* --- State --- */
            let state = {
                letterIndex: 0,
                notebookIndex: 0,
                isEnvelopeOpen: false
            };

            /* --- DOM Elements --- */
            const el = {
                envelopeStage: document.getElementById('envelope-stage'),
                envelopeWrapper: document.getElementById('envelope-click-target'),
                envelope: document.getElementById('mainEnvelope'),
                letterStage: document.getElementById('letter-stage'),
                notebookStage: document.getElementById('notebook-stage'),
                letterContent: document.getElementById('letter-content'),
                dots: document.getElementById('dots-container'),
                notebookPages: document.getElementById('notebook-pages'),
                canvas: document.getElementById('flowerCanvas'),
                // Buttons
                btnNext: document.getElementById('btn-next-letter'),
                btnPrev: document.getElementById('btn-prev-letter'),
                btnOpenNote: document.getElementById('btn-open-notebook'),
                btnCloseNote: document.getElementById('btn-close-notebook'),
                notebookArea: document.getElementById('notebook-content-area')
            };

            /* --- Flower Engine --- */
            const ctx = el.canvas.getContext('2d');
            let width, height;
            let particles = [];
            const emojis = ['🌸', '🌹', '🌺', '🌷', '✨', '💖'];

            function resize() {
                width = window.innerWidth;
                height = window.innerHeight;
                el.canvas.width = width;
                el.canvas.height = height;
            }
            window.addEventListener('resize', resize);
            resize();

            class Particle {
                constructor(x, y, type, burst) {
                    this.x = x;
                    this.y = y;
                    this.type = type;
                    this.size = Math.random() * 20 + 10;
                    this.speedY = Math.random() * 2 + 1 + (burst ? 2 : 0);
                    this.speedX = Math.random() * 2 - 1;
                    this.rotation = Math.random() * 360;
                    this.spin = Math.random() * 2 - 1;
                }
                update() {
                    this.y += this.speedY;
                    this.x += Math.sin(this.y * 0.01) + this.speedX;
                    this.rotation += this.spin;
                }
                draw() {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.rotation * Math.PI / 180);
                    ctx.font = `${this.size}px serif`;
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText(this.type, 0, 0);
                    ctx.restore();
                }
            }

            function animate() {
                ctx.clearRect(0, 0, width, height);
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.update();
                    p.draw();
                    if (p.y > height) particles.splice(i, 1);
                }
                requestAnimationFrame(animate);
            }
            animate(); // Start loop immediately

            function rainFlowers() {
                setInterval(() => {
                    if (state.isEnvelopeOpen && particles.length < 40) {
                        particles.push(new Particle(Math.random() * width, -30, emojis[Math.floor(Math.random() * emojis.length)], false));
                    }
                }, 400);
            }

            function burstFlowers(emoji) {
                for(let i=0; i<15; i++) {
                    particles.push(new Particle(
                        Math.random() * width, -20, 
                        emoji || emojis[Math.floor(Math.random() * emojis.length)], 
                        true
                    ));
                }
            }

            /* --- Logic --- */

            // 1. Render Letter
            function renderLetter() {
                const item = letters[state.letterIndex];
                el.letterContent.style.opacity = '0';
                
                setTimeout(() => {
                    el.letterContent.innerHTML = `
                        <h2 class="handwriting text-4xl text-pink-600 mb-4">${item.title}</h2>
                        <div class="w-16 h-1 bg-pink-200 mb-6 rounded-full"></div>
                        <p class="text-gray-700 text-lg leading-relaxed font-light">${item.body}</p>
                    `;
                    
                    // Render dots
                    el.dots.innerHTML = letters.map((_, i) => 
                        `<div class="h-2 rounded-full transition-all duration-300 ${i === state.letterIndex ? 'bg-pink-500 w-6' : 'bg-pink-200 w-2'}"></div>`
                    ).join('');

                    el.letterContent.style.opacity = '1';
                }, 200);
            }

            // 2. Render Notebook
            function renderNotebook() {
                const item = notebookEntries[state.notebookIndex];
                el.notebookPages.innerHTML = `
                    <div class="notebook-page active-page">
                        <div class="border-b-2 border-gray-300 mb-6 pb-2 flex justify-between items-end">
                            <span class="text-gray-400 text-sm italic">Date: Today</span>
                            <span class="notebook-font text-2xl text-pink-600">${item.date}</span>
                        </div>
                        <p class="notebook-font text-2xl text-gray-800 leading-loose">
                            ${item.text}
                        </p>
                        <div class="mt-auto text-center text-gray-400 text-xs uppercase tracking-widest">
                            Page ${state.notebookIndex + 1} / ${notebookEntries.length}
                        </div>
                    </div>
                `;
            }

            /* --- Event Handlers --- */

            // Open Envelope
            el.envelopeWrapper.addEventListener('click', () => {
                if (state.isEnvelopeOpen) return;
                state.isEnvelopeOpen = true;
                
                // Visuals
                el.envelope.classList.add('open');
                rainFlowers(); // Start rain
                
                // Transition
                setTimeout(() => {
                    el.envelopeStage.style.opacity = '0';
                    setTimeout(() => {
                        el.envelopeStage.style.display = 'none';
                        el.letterStage.classList.add('active');
                        burstFlowers();
                    }, 500);
                }, 1000);
            });

            // Letter Navigation
            el.btnNext.addEventListener('click', () => {
                state.letterIndex = (state.letterIndex + 1) % letters.length;
                renderLetter();
                burstFlowers();
            });

            el.btnPrev.addEventListener('click', () => {
                state.letterIndex = (state.letterIndex - 1 + letters.length) % letters.length;
                renderLetter();
            });

            // Notebook Navigation (Tap Sides)
            el.notebookArea.addEventListener('click', (e) => {
                const rect = el.notebookArea.getBoundingClientRect();
                const x = e.clientX - rect.left;
                
                if (x > rect.width / 2) {
                    // Next Page
                    if (state.notebookIndex < notebookEntries.length - 1) {
                        state.notebookIndex++;
                        renderNotebook();
                        burstFlowers('✨');
                    }
                } else {
                    // Prev Page
                    if (state.notebookIndex > 0) {
                        state.notebookIndex--;
                        renderNotebook();
                    }
                }
            });

            // Switch Stages
            el.btnOpenNote.addEventListener('click', () => {
                el.letterStage.classList.remove('active');
                el.letterStage.classList.add('hidden-left');
                
                setTimeout(() => {
                    el.notebookStage.classList.add('active');
                    burstFlowers('📖');
                }, 300);
            });

            el.btnCloseNote.addEventListener('click', () => {
                el.notebookStage.classList.remove('active');
                
                setTimeout(() => {
                    el.letterStage.classList.remove('hidden-left');
                    el.letterStage.classList.add('active');
                }, 300);
            });

            // Initialize content
            renderLetter();
            renderNotebook();
        });
    </script>
</body>
</html>
